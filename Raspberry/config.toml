[link]
# How the Pi reaches the ESP32 (firmware v21+):
#   "uart" = three wires, Pi GPIO 14/15 <-> ESP32 GPIO 20/19 (Hardware/pinout.md)
#   "ble"  = Bluetooth, the [ble] settings below
kind = "uart"
uart_port = "/dev/serial0"
uart_baud = 115200
link_s = 5.0                         # ESP32 silent this long = link lost

# DRIFTS v2 — Raspberry Pi configuration

[ble]
device_name = "DRIFTS-ESP32"        # ESP32 to connect to
address = ""                         # optional MAC for faster connection
reconnect_s = 3.0
service_uuid = "DF710001-B5A3-F393-E0A9-E50E24DCCA9E"
wake_char_uuid = "DF710002-B5A3-F393-E0A9-E50E24DCCA9E"
result_char_uuid = "DF710003-B5A3-F393-E0A9-E50E24DCCA9E"
# PING interval. The ESP32 fail-safe cuts the alert if the Pi is silent
# for longer than FAILSAFE_MS (3 s) in its config.h. Keep this below it.
heartbeat_s = 1.0

[camera]
width = 640
height = 480
fps = 10                             # capture rate (inference will be slower)
# Raspberry Pi Camera Module 3 NoIR (IMX708, autofocus). Focus held at the
# driver's face: lens_position is 1 / distance in metres (1.7 = ~0.6 m).
# "continuous" can hunt in dim IR light; "auto" focuses once at start.
focus = "manual"
lens_position = 1.7

[detector]
model_param = "model/mobilenetv2_dms.param"
model_bin   = "model/mobilenetv2_dms.bin"
model_onnx  = "model/mobilenetv2_dms.onnx"
input_size  = 224                    # MobileNetV2 input resolution (224x224)
conf_threshold = 0.5                 # minimum detection confidence
# How many consecutive "drowsy" frames before we declare DROWSY
drowsy_frame_threshold = 3
# How many total frames to analyze per wake cycle
max_frames_per_cycle = 30            # at ~3-5 FPS ≈ 6-10 seconds of analysis

[power]
idle_camera_off = true               # turn off camera when not analyzing
cooldown_s = 10                      # wait before accepting another WAKE

[whisplay]
# PiSugar Whisplay HAT: driver screen, RGB LED, speaker, button.
# Install PiSugar's driver first (Hardware/whisplay-hat.md), then set true.
enabled = false
driver_dir = "~/Whisplay/runtime"
audio_device = "default"   # PiSugar's asound.conf sends it to the HAT at 48 kHz (plughw: fails on the ES8389 codec)
brightness = 70        # 0-100 at first start; then the button's last level
remember_brightness = true
voice = true
repeat_s = 60.0        # Level 2 warning repeats this often
stale_s = 5.0          # ESP32 status older than this = connection lost
# The screen changes by itself (score, calibration from the phone app, the
# awake check). The side button's short press sets the screen brightness
# (10 -> 30 -> 50 -> 70 -> 100 %, remembered over restarts). Actions:
# brightness, brightness_up, brightness_down, repeat_voice, calibrate,
# awake_check (show the awake screen), none. During an alert or the awake
# check any press confirms "I'm awake"; that can't be changed.
button_short = "brightness"
button_long = "repeat_voice"     # held >= long_s
button_double = "calibrate"      # two presses within double_s ("none" = no wait after a press)
long_s = 1.5
button_hold = "shutdown"         # held >= hold_s: power the Pi off safely ("none" = off). Not during an alert or while moving
hold_s = 5.0
double_s = 0.4
joystick = false       # ours is the plain version (no joystick); true on the "Joy" version
rotate = 0             # picture turned clockwise: 0, 90, 180 (upside down) or 270
awake_after_s = 20.0   # an alert this long asks "Say 'I am awake'" (0 = off)
awake_window_s = 10.0  # how long it asks
# Start-up (with the camera): "Who's driving? Say your name" (drivers from the phone
# app + Guest; a short press moves down the list, a long press picks), then the face
# check and calibration with the camera on the LCD.
select_driver = true
select_timeout_s = 15.0  # no answer: whoever drove last (or Guest)
face_check = true
