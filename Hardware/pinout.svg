<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 970" width="1180" height="970" font-family="Helvetica, Arial, sans-serif">
<rect width="1180" height="970" fill="#ffffff"/>
<text x="590.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">DRIFTS — ESP32-C6 pinout (firmware v18, schematic rev 5)</text>
<text x="590.0" y="60" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Find pins by the label printed on the board, not by position. Same-named power tags are the same wire.</text>
<rect x="40" y="70" width="190" height="720" rx="12" fill="#1f3b5c" stroke="#0f2236" stroke-width="2"/>
<text x="135.0" y="750" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">ESP32-C6</text>
<text x="135.0" y="770" font-size="13" fill="#cfe0f2" text-anchor="middle" font-weight="normal">WROOM-1 N8 dev kit</text>
<text x="216" y="101" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">5V</text>
<circle cx="230" cy="96" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="96" x2="380" y2="96" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="83" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="101" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">5 V rail</text>
<line x1="640" y1="96" x2="670" y2="96" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="101" font-size="14" fill="#222" text-anchor="start" font-weight="normal">LCD · shifter HV · 74AHCT125 · LED strip · DFPlayer</text>
<text x="216" y="147" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">3V3</text>
<circle cx="230" cy="142" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="142" x2="380" y2="142" stroke="#f57c00" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="129" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="147" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">3.3 V rail</text>
<line x1="640" y1="142" x2="670" y2="142" stroke="#f57c00" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="147" font-size="14" fill="#222" text-anchor="start" font-weight="normal">MPU-6050 VCC · shifter LV · motor module VCC</text>
<text x="216" y="193" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GND</text>
<circle cx="230" cy="188" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="188" x2="380" y2="188" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="193" font-size="14" fill="#222" text-anchor="start" font-weight="normal">every part: one common ground</text>
<text x="216" y="239" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 2</text>
<circle cx="230" cy="234" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="234" x2="380" y2="234" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="221" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="239" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">100 Ω → LED → GND</text>
<line x1="640" y1="234" x2="670" y2="234" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="239" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Green status LED (connections)</text>
<text x="216" y="285" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 3</text>
<circle cx="230" cy="280" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="280" x2="380" y2="280" stroke="#f9a825" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="267" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="285" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">330 Ω → LED → GND</text>
<line x1="640" y1="280" x2="670" y2="280" stroke="#f9a825" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="285" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Yellow status LED (caution / system)</text>
<text x="216" y="331" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 4</text>
<circle cx="230" cy="326" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="326" x2="380" y2="326" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="313" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="331" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">330 Ω → LED → GND</text>
<line x1="640" y1="326" x2="670" y2="326" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="331" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Red status LED (drowsy) · LED only, strapping pin</text>
<text x="216" y="377" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 10</text>
<circle cx="230" cy="372" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="372" x2="380" y2="372" stroke="#6a1b9a" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="359" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="377" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">R1 100 Ω · R2 10 kΩ to GND</text>
<line x1="640" y1="372" x2="670" y2="372" stroke="#6a1b9a" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="377" font-size="14" fill="#222" text-anchor="start" font-weight="normal">IN of the 4 vibration motor modules</text>
<text x="216" y="423" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 11</text>
<circle cx="230" cy="418" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="418" x2="380" y2="418" stroke="#00838f" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="405" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="423" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">R6 100 Ω</text>
<line x1="640" y1="418" x2="670" y2="418" stroke="#00838f" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="423" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Piezo LS1 leg 1 (5 kHz)</text>
<text x="216" y="469" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 18</text>
<circle cx="230" cy="464" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="464" x2="380" y2="464" stroke="#00838f" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="451" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="469" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">R7 100 Ω</text>
<line x1="640" y1="464" x2="670" y2="464" stroke="#00838f" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="469" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Piezo LS1 leg 2 (same tone, inverted)</text>
<text x="216" y="515" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 19</text>
<circle cx="230" cy="510" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="510" x2="380" y2="510" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="497" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="515" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">R11 1 kΩ</text>
<line x1="640" y1="510" x2="670" y2="510" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="515" font-size="14" fill="#222" text-anchor="start" font-weight="normal">DFPlayer Mini RX (pin 2) · UART1 TX</text>
<text x="216" y="561" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 20</text>
<circle cx="230" cy="556" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="556" x2="380" y2="556" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="543" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="561" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">direct</text>
<line x1="640" y1="556" x2="670" y2="556" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="561" font-size="14" fill="#222" text-anchor="start" font-weight="normal">DFPlayer Mini TX (pin 3) · UART1 RX</text>
<text x="216" y="607" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 21</text>
<circle cx="230" cy="602" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="602" x2="380" y2="602" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="589" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="607" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">BSS138 shifter for the LCD</text>
<line x1="640" y1="602" x2="670" y2="602" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="607" font-size="14" fill="#222" text-anchor="start" font-weight="normal">I2C SDA: MPU-6050 SDA + shifter LV1 → LCD SDA</text>
<text x="216" y="653" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 22</text>
<circle cx="230" cy="648" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="648" x2="380" y2="648" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="635" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="653" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">BSS138 shifter for the LCD</text>
<line x1="640" y1="648" x2="670" y2="648" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="653" font-size="14" fill="#222" text-anchor="start" font-weight="normal">I2C SCL: MPU-6050 SCL + shifter LV2 → LCD SCL</text>
<text x="216" y="699" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">GPIO 23</text>
<circle cx="230" cy="694" r="6" fill="#f2c94c" stroke="#8a6d1f"/>
<line x1="236" y1="694" x2="380" y2="694" stroke="#ad1457" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="681" width="250" height="26" rx="6" fill="#fff7e0" stroke="#c9a227"/>
<text x="515" y="699" font-size="12.5" fill="#5c4400" text-anchor="middle" font-weight="normal">74AHCT125 1A→1Y · R10 330 Ω</text>
<line x1="640" y1="694" x2="670" y2="694" stroke="#ad1457" stroke-width="4" stroke-linecap="round"/>
<text x="680" y="699" font-size="14" fill="#222" text-anchor="start" font-weight="normal">WS2812B LED strip DIN (14 LEDs)</text>
<text x="40" y="816" font-size="13" fill="#7a1010" text-anchor="start" font-weight="normal">⚠ Do not use: 5, 8, 9, 15 (strapping) · 6, 7 (JTAG) · 12, 13 (USB) · 16, 17 (UART0 serial monitor) · 14, 24–30 (flash: corrupts it silently).</text>
<text x="40" y="838" font-size="13" fill="#7a1010" text-anchor="start" font-weight="normal">⚠ GPIO 4 is a strapping pin: the red LED + resistor to GND and nothing else.</text>
<text x="40" y="860" font-size="13" fill="#7a1010" text-anchor="start" font-weight="normal">⚠ LCD backpack is a 5 V part: its SDA/SCL go through the BSS138 shifter (HV side), never straight to GPIO 21/22.</text>
<text x="40" y="882" font-size="13" fill="#7a1010" text-anchor="start" font-weight="normal">⚠ LED strip data needs ≥ 3.5 V: GPIO 23 → 74AHCT125 (VCC 5 V) → 330 Ω → DIN. 1000 µF across the strip's 5V/GND.</text>
<text x="40" y="904" font-size="13" fill="#7a1010" text-anchor="start" font-weight="normal">⚠ DFPlayer: GPIO 19 → 1 kΩ → RX, TX → GPIO 20 (crossed). Speaker on SPK_1/SPK_2 (4–8 Ω, ≤ 3 W), neither to GND.</text>
<text x="40" y="926" font-size="13" fill="#444" text-anchor="start" font-weight="normal">Full wiring: Hardware/pinout.md · drawing: Hardware/drawings/DRIFTS_Schematic_rev5.pdf</text>
</svg>